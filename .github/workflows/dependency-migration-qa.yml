name: Dependency Migration QA

on:
  push:
    branches: ['chore/dependency-hygiene-vite8']
    paths: ['.github/workflows/dependency-migration-qa.yml']

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/dependency-hygiene-vite8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install current dependencies
        run: npm ci

      - name: Migrate build toolchain
        run: |
          npm uninstall @types/jszip
          npm install --save-dev vite@8.2.2 @vitejs/plugin-react@6.0.5

      - name: Verify dependency graph
        shell: bash
        run: |
          npm ls vite @vitejs/plugin-react jszip
          if npm ls @types/jszip >/dev/null 2>&1; then
            echo '@types/jszip is still installed'
            exit 1
          fi

      - name: Audit migrated dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('audit metadata:', JSON.stringify(counts));
          if ((counts.total ?? 0) !== 0) process.exit(1);
          NODE

      - name: Build production app
        run: npm run build

      - name: Verify relative asset paths
        shell: bash
        run: |
          grep -Eq '(src|href)="\./assets/' dist/index.html
          echo 'Built index uses relative ./assets paths.'

      - name: Verify migration diff scope
        shell: bash
        run: |
          unexpected="$(git status --short | grep -vE '^( M|M |\?\?) (package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected changes from dependency migration:'
            echo "$unexpected"
            exit 1
          fi

      - name: Install Chromium smoke tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ai-master-guide-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-master-guide-preview.log
          exit 1

      - name: Run desktop and mobile Chromium smoke
        shell: bash
        run: |
          cat > smoke.spec.mjs <<'EOF'
          import { test, expect } from '@playwright/test';

          const tabLabels = [
            'AI 모델 데이터 & 성능 비교',
            '디자인 준비 (DESIGN.md)',
            '개발 환경 & 맞춤 ZIP 다운',
            'MCP 도구 연결 허브',
            '웹·앱 개발 6단계 로드맵',
            '인프라 가이드 (보안·DB·서버)',
          ];

          for (const profile of [
            { name: 'desktop', viewport: { width: 1440, height: 900 }, verifyDownload: true },
            { name: 'mobile-390x844', viewport: { width: 390, height: 844 }, verifyDownload: false },
          ]) {
            test(profile.name, async ({ page }) => {
              const errors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') errors.push(`console: ${message.text()}`);
              });
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));

              await page.setViewportSize(profile.viewport);
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await expect(page.getByRole('heading', { name: 'AI 기반 프로덕트 개발 마스터 가이드' })).toBeVisible();

              for (const label of tabLabels) {
                await page.getByRole('button', { name: new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')) }).click();
                await expect(page.locator('main')).toBeVisible();
              }

              if (profile.verifyDownload) {
                await page.getByRole('button', { name: /개발 환경 & 맞춤 ZIP 다운/ }).click();
                const downloadPromise = page.waitForEvent('download');
                await page.getByRole('button', { name: 'Harness v2 ZIP 다운로드' }).click();
                const download = await downloadPromise;
                expect(download.suggestedFilename()).toMatch(/^portable-ai-harness-v2-\d+skills\.zip$/);
              }

              expect(errors, errors.join('\n')).toEqual([]);
            });
          }
          EOF
          npx playwright test smoke.spec.mjs --reporter=line --workers=1
          rm smoke.spec.mjs

      - name: Commit migrated dependency files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore: migrate Vite toolchain and remove jszip stub types'
          git push origin HEAD:chore/dependency-hygiene-vite8
