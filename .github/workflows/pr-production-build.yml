name: PR Production Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-production-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Install temporary Playwright Chromium
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y > /dev/null
          npm install playwright@latest --no-save
          npx playwright install --with-deps chromium

      - name: Browser and ZIP smoke test
        run: |
          cat > /tmp/pw/harness-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');

          async function waitForGeneratedFile(page, path) {
            const escaped = path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            await page.getByRole('button', { name: new RegExp('^' + escaped) }).waitFor();
          }

          async function main() {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const browserErrors = [];

            page.on('console', (message) => {
              if (message.type() === 'error') browserErrors.push('console: ' + message.text());
            });
            page.on('pageerror', (error) => browserErrors.push('pageerror: ' + error.message));

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.getByRole('button', { name: /개발 환경 & 맞춤 ZIP 다운/ }).click();
            await page.getByRole('heading', { name: '하나의 프로젝트 규칙, 세 도구의 네이티브 환경' }).waitFor();

            for (const path of ['.codex/config.toml', '.mcp.json', '.agents/mcp_config.json', 'docs/tasks/ACTIVE.md']) {
              await waitForGeneratedFile(page, path);
            }
            await waitForGeneratedFile(page, 'MCP_추천_목록.md');

            for (const path of [
              '.agents/skills/capability-router/SKILL.md',
              '.claude/skills/capability-router/SKILL.md',
              '.agents/skills/continue-work/SKILL.md',
              '.claude/skills/continue-work/SKILL.md',
            ]) {
              await waitForGeneratedFile(page, path);
            }

            await page.getByText('Playwright MCP', { exact: true }).waitFor();
            await page.getByText('GitHub MCP Server', { exact: true }).waitFor();
            await page.getByText('Context7 MCP', { exact: true }).waitFor();

            const links = await page.locator('a[target="_blank"]').evaluateAll((nodes) => nodes.map((node) => node.href));
            for (const expected of [
              'https://github.com/microsoft/playwright-mcp',
              'https://github.com/github/github-mcp-server',
              'https://github.com/upstash/context7',
            ]) {
              if (!links.some((href) => href.startsWith(expected))) throw new Error('Missing MCP official link: ' + expected);
            }

            await page.getByRole('button', { name: /^Browser QA/ }).click();
            await waitForGeneratedFile(page, '.agents/skills/browser-qa/SKILL.md');
            await waitForGeneratedFile(page, '.claude/skills/browser-qa/SKILL.md');

            await page.getByRole('button', { name: '기본값' }).click();
            if (await page.getByRole('button', { name: /^\.agents\/skills\/browser-qa\/SKILL\.md/ }).count()) {
              throw new Error('Optional Browser QA skill remained after reset.');
            }
            await waitForGeneratedFile(page, '.agents/skills/capability-router/SKILL.md');
            await waitForGeneratedFile(page, '.agents/skills/continue-work/SKILL.md');

            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: /Harness v2 ZIP 다운로드/ }).click();
            const download = await downloadPromise;
            await download.saveAs('/tmp/harness-default.zip');

            await page.screenshot({ path: '/tmp/harness-desktop.png', fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('button', { name: /개발 환경 & 맞춤 ZIP 다운/ }).click();
            await page.getByRole('heading', { name: '하나의 프로젝트 규칙, 세 도구의 네이티브 환경' }).waitFor();
            await waitForGeneratedFile(page, 'docs/tasks/ACTIVE.md');
            await page.screenshot({ path: '/tmp/harness-mobile.png', fullPage: true });

            if (browserErrors.length) throw new Error(browserErrors.join('\n'));
            await browser.close();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
          cd /tmp/pw
          node harness-smoke.cjs

      - name: Validate downloaded Harness ZIP
        run: |
          rm -rf /tmp/harness-default
          mkdir -p /tmp/harness-default
          unzip -q /tmp/harness-default.zip -d /tmp/harness-default

          test -f /tmp/harness-default/AGENTS.md
          test -f /tmp/harness-default/CLAUDE.md
          test -f /tmp/harness-default/DESIGN.md
          test -f /tmp/harness-default/MCP_추천_목록.md
          test -f /tmp/harness-default/.codex/config.toml
          test -f /tmp/harness-default/.mcp.json
          test -f /tmp/harness-default/.agents/mcp_config.json
          test -f /tmp/harness-default/.agents/rules/project-core.md
          test -f /tmp/harness-default/docs/tasks/ACTIVE.md
          test -f /tmp/harness-default/docs/tasks/README.md
          test -f /tmp/harness-default/docs/ai-harness/behavior-evals.md
          test -f /tmp/harness-default/.agents/skills/capability-router/SKILL.md
          test -f /tmp/harness-default/.claude/skills/capability-router/SKILL.md
          test -f /tmp/harness-default/.agents/skills/continue-work/SKILL.md
          test -f /tmp/harness-default/.claude/skills/continue-work/SKILL.md

          grep -q 'Scoped instruction resolution' /tmp/harness-default/AGENTS.md
          grep -q 'docs/tasks/ACTIVE.md' /tmp/harness-default/AGENTS.md
          grep -q 'AGENTS.override.md' /tmp/harness-default/AGENTS.md
          grep -q 'Resumes an existing multi-session or cross-client repository task' /tmp/harness-default/.agents/skills/continue-work/SKILL.md
          grep -q 'Antigravity -> Codex resume' /tmp/harness-default/docs/ai-harness/behavior-evals.md
          grep -q 'Codex -> Claude Code resume' /tmp/harness-default/docs/ai-harness/behavior-evals.md
          grep -q 'Claude Code -> Antigravity resume' /tmp/harness-default/docs/ai-harness/behavior-evals.md

          if grep -q '@../../AGENTS.md' /tmp/harness-default/.agents/rules/project-core.md || grep -q '@../../DESIGN.md' /tmp/harness-default/.agents/rules/project-core.md; then
            echo 'Antigravity project-core unexpectedly re-imports shared always-on context.'
            exit 1
          fi

          node - <<'EOF'
          const fs = require('fs');
          for (const file of ['/tmp/harness-default/.mcp.json', '/tmp/harness-default/.agents/mcp_config.json']) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!parsed.mcpServers || Object.keys(parsed.mcpServers).length !== 0) {
              throw new Error('MCP config is not an empty skeleton: ' + file);
            }
          }
          EOF

          if grep -q '\[mcp_servers\.' /tmp/harness-default/.codex/config.toml; then
            echo 'Codex config unexpectedly contains an MCP server entry.'
            exit 1
          fi

          grep -q 'https://github.com/microsoft/playwright-mcp' /tmp/harness-default/MCP_추천_목록.md
          grep -q 'https://github.com/github/github-mcp-server' /tmp/harness-default/MCP_추천_목록.md
          grep -q 'https://github.com/upstash/context7' /tmp/harness-default/MCP_추천_목록.md

          if grep -E 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            /tmp/harness-default/.codex/config.toml \
            /tmp/harness-default/.mcp.json \
            /tmp/harness-default/.agents/mcp_config.json; then
            echo 'Potential credential detected in generated MCP config skeletons.'
            exit 1
          fi

          cd /tmp/harness-default
          node scripts/validate-ai-harness.mjs
          mkdir -p .claude/skills/claude-only
          printf '%s\n' '---' 'name: claude-only' 'description: Claude-only preservation probe.' '---' '# Claude-only skill' > .claude/skills/claude-only/SKILL.md
          node scripts/sync-ai-harness.mjs
          test -f .claude/skills/claude-only/SKILL.md
          node scripts/validate-ai-harness.mjs
